# Runs everything that can be checked without the real library: on every push to main and on every pull request.
#
#   server  unit tests and the war                      (server/, Java 27, Maven)
#   client  lint, unit tests, type check of the e2e     (client/, Node 24)
#   e2e     the Playwright tests against the throwaway  (client/e2e, Docker stack of client/e2e/compose.e2e.yaml)
#           Docker stack, which builds the real image
#
# The versions follow the Dockerfile (node:24, Java 27). Nothing here needs a secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch makes the run of the older one pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (unit tests, war)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: server/pom.xml
      # package runs the unit tests and then builds the war, as a deployment would
      - name: Unit tests and war
        run: mvn -B --no-transfer-progress package
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: server/target/surefire-reports/
          retention-days: 7

  client:
    name: Client (lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type check of the e2e tests
        run: npm run e2e:typecheck

  e2e:
    name: End to end (Docker stack, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # the media of the tests (a tone, a short video with chapters and thumbnails) are generated by ffmpeg
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the browser of Playwright
        run: npx playwright install --with-deps chromium
      # builds the image from the Dockerfile (production build of the client, war of the server), starts it with an
      # empty MySQL, runs the tests and removes the stack again (see client/e2e/global-setup.ts)
      - name: End to end tests
        run: npm run e2e
        env:
          # the runner is thrown away anyway; a stack that is still there can be asked for its logs after a failure
          E2E_KEEP_STACK: '1'
      - name: Logs of the stack
        if: failure()
        run: docker compose -f e2e/compose.e2e.yaml logs --no-color --tail 300 || true
        env:
          MEDIA_DIR: ${{ github.workspace }}/client/e2e/.media
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7
