# Profile of the Docker image (see compose.yaml) and of every other production run. Everything that differs between
# installations comes from the environment.
# Spring JPA
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:portalsync}?serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:portalsync}
spring.datasource.password=${MYSQL_PASSWORD}
# Server
server.port=${SERVER_PORT:8080}
# the client is served by this server, usually behind a TLS proxy
server.forward-headers-strategy=framework
# Client: CLIENT_ORIGIN is the only origin allowed for CORS and the WebSocket, e.g. https://portalsync.example.org
client.origin=${CLIENT_ORIGIN:http://localhost:8080}
client.storage-path=${MEDIA_PATH:/media/}
# spotify
spotify.client.id=${SPOTIFY_CLIENT_ID:}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:}
spotify.client.redirect=${SPOTIFY_REDIRECT_URI:${CLIENT_ORIGIN:http://localhost:8080}/spotify/redirect}
# Neverpile Crypto: no default, the key signs the media URLs
neverpile.url-crypto.shared-secret.secret-key=${URLCRYPTO_SECRET}
