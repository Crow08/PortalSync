# Spring JPA
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:music_stream_server}?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
# Server
server.port=8081
# Client
client.host=127.0.0.1
client.port=4200
client.storage-path=F:/media/
# spotify
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:}
spotify.client.id=${SPOTIFY_CLIENT_ID:}
spotify.client.redirect=http://127.0.0.1:4200/spotify/redirect
# Neverpile Crypto
neverpile.url-crypto.shared-secret.secret-key=Not#So%Secret
# DEBUG:
# logging.level.org.springframework.security=DEBUG
# logging.level.com.neverpile.urlcrypto.*=DEBUG
# spring.jpa.show-sql=true
