spring.profiles.active=dev
spring.application.name=PortalSync
# Spring HTTP
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
# Neverpile Crypto
neverpile.url-crypto.shared-secret.enabled=true
neverpile.url-crypto.pathPatterns=/**
neverpile.url-crypto.psuEnabledPathPatterns=/api/v1/media/data/**,/api/v1/media/thumbnails/**
neverpile.url-crypto.csrfEnabled=false
