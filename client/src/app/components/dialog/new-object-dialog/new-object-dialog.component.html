<h2 class="title" mat-dialog-title>{{ 'dialogs.newObject.title' | transloco: { name: (data.displayName | transloco) } }}</h2>
<form (ngSubmit)="create()">
  <mat-dialog-content>
    @for (prop of data.stringProperties; track prop.key) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ prop.displayName | transloco }}</mat-label>
        <input [(ngModel)]="prop.value" [name]="prop.key" autocomplete="off" matInput/>
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button (click)="onNoClick()" mat-button type="button">{{ 'common.cancel' | transloco }}</button>
    <button color="primary" mat-flat-button type="submit">{{ 'common.create' | transloco }}</button>
  </mat-dialog-actions>
</form>
