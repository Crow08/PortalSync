<h2 class="title" mat-dialog-title>{{ 'dialogs.spotifyLogin.title' | transloco }}</h2>
<mat-dialog-content>
  <p class="message">
    {{ 'dialogs.spotifyLogin.message' | transloco }}
  </p>
  @if (checked && !authUrl) {
    <p class="message">{{ 'common.spotifyNotSetUp' | transloco }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">{{ 'common.cancel' | transloco }}</button>
  @if (authUrl) {
    <a (click)="rememberPage()" [href]="authUrl" color="primary" mat-flat-button>{{ 'common.loginWithSpotify' | transloco }}</a>
  }
</mat-dialog-actions>
