<div [class.dragging]="dragging" class="progress-wrapper" #wrapper>
  <div class="time-display">
    {{getTimeDisplay()}}
  </div>
  <mat-slider [max]=100 [min]=0 [step]=0.1 class="overlay-slider" color="accent" #slider
    (pointermove)="onPointerMove($event)" (pointerdown)="onPointerDown($event)" (pointerleave)="onPointerLeave()">
    <input matSliderThumb (valueChange)="onSeek($event)" [ngModel]="displayedProgression" id="slider">
  </mat-slider>
  <!-- one segment per chapter, separated by gaps -->
  <div [class.loading]="loading" aria-hidden="true" class="segments">
    @for (segment of segments; track $index) {
      <div [style.flex-grow]="segment.length" class="segment"><div [style.width.%]="segment.fill" class="fill"></div></div>
    }
  </div>
  @if (preview) {
    <div class="seek-preview" [style.left.px]="preview.left">
      @if (preview.tilePosition) {
        <div class="seek-preview-image"
          [style.width.px]="thumbnailWidth" [style.height.px]="thumbnailHeight"
          [style.background-image]="thumbnailBackground"
        [style.background-position]="preview.tilePosition"></div>
      }
      <div class="seek-preview-time">
        @if (preview.chapter) {
          <div class="seek-preview-chapter">{{preview.chapter}}</div>
        }
        {{preview.time}}
      </div>
    </div>
  }
</div>
