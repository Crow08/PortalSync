<div class="mini-player">
  <div class="media-info" [title]="(currentMedia.title || ('player.nothingPlaying' | transloco)) + ' – ' + (getSubTitle() || '')">
    <div class="cover"></div>
    <div class="texts">
      <div class="song-title">{{ currentMedia.title || ('player.nothingPlaying' | transloco) }}</div>
      <div class="sub">{{ getSubTitle() || ((currentMedia.title ? 'player.unknownArtist' : 'player.sessionEmpty') | transloco) }}</div>
    </div>
  </div>

  <div class="controls">
    <div class="control-buttons">
      <button (click)="publishCommand('previous')" [attr.aria-label]="'player.previous' | transloco" class="btn-previous" mat-icon-button
        [title]="'player.tip.previous' | transloco" type="button">
        <mat-icon>skip_previous</mat-icon>
      </button>
      <button (click)="togglePlayback()" [attr.aria-label]="(playerState === 'PLAY' ? 'player.pause' : 'player.play') | transloco" class="play"
        [class.playing]="playerState === 'PLAY'" mat-icon-button
        [title]="(playerState === 'PLAY' ? 'player.tip.pause' : 'player.tip.play') | transloco" type="button">
        <mat-icon>{{ playerState === 'PLAY' ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>
      <button (click)="publishCommand('skip')" [attr.aria-label]="'player.next' | transloco" class="btn-next" mat-icon-button
        [title]="'player.tip.next' | transloco" type="button">
        <mat-icon>skip_next</mat-icon>
      </button>
    </div>
    <app-player-track (seek)="jumpOffset($event)" [chapters]="chapters" [compact]="true" [playerState]="playerState"
      [thumbnailUrl]="thumbnailUrl"></app-player-track>
  </div>

  <div class="side">
    <mat-icon class="volume-icon">volume_up</mat-icon>
    <mat-slider [max]="0.4" [min]="0" [step]="0.004" class="volume-slider ps-slider ps-slider-compact" [title]="'player.tip.volume' | transloco">
      <input (valueChange)="setVolume($event)" matSliderThumb value="{{ getVolume() }}"/>
    </mat-slider>
    <button (click)="backToSession()" [attr.aria-label]="'player.backToPlayer' | transloco" mat-icon-button
      [title]="'player.tip.backToPlayer' | transloco" type="button">
      <mat-icon>open_in_new</mat-icon>
    </button>
  </div>
</div>
